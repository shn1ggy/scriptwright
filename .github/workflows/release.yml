# Builds Scriptwright for macOS (Apple Silicon and Intel) and Windows and publishes a GitHub
# release whenever a version tag is pushed:
#
#   git tag v0.18.0 && git push origin v0.18.0
#
# The tag must match "version" in package.json. Every file gets a .sha256 next to it; the app's
# updater refuses downloads without one.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(node -p "require('./package.json').version")"
          [ "$want" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json ($want)"; exit 1; }

  app:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        shell: bash
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Unit tests
        if: runner.os != 'Windows'
        shell: bash
        run: npm test 2>&1 | tee ci-test.log
      - name: Build
        shell: bash
        run: node scripts/build.mjs --prod 2>&1 | tee ci-build.log
      - name: Package
        shell: bash
        run: npx electron-builder ${{ matrix.target }} --publish never 2>&1 | tee ci-package.log
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Checksums
        shell: bash
        run: |
          cd release
          for f in *.dmg *-mac-*.zip *.exe; do
            [ -f "$f" ] || continue
            if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
          done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*-mac-*.zip
            release/*.exe
            release/*.sha256
      # Temporary: our normal log download is blocked from the AI session's network, so a
      # failure posts its own tail to an issue instead. Remove once the release pipeline works.
      - name: Report failure (temporary diagnostic)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### ${{ matrix.os }} (${{ matrix.target }}) — run ${{ github.run_id }}"
            for f in ci-test.log ci-build.log ci-package.log; do
              [ -f "$f" ] || continue
              echo "#### $f (last 200 lines)"
              echo '```'
              tail -n 200 "$f"
              echo '```'
            done
          } > ci-report.md
          gh issue create --title "CI diagnostic: ${{ matrix.os }} run ${{ github.run_id }}" --body-file ci-report.md

  source:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Source package (for project-folder and portable installs)
        run: node scripts/release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: source
          if-no-files-found: error
          path: release/scriptwright-*.zip*

  publish:
    needs: [app, source]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
