# Builds Scriptwright for macOS (Apple Silicon and Intel) and Windows and publishes a GitHub
# release whenever a version tag is pushed:
#
#   git tag v0.18.0 && git push origin v0.18.0
#
# Pushing a package.json version bump to main also builds and publishes that version.
# Existing tags are refused on this path so published installers cannot be replaced.
# The tag must match "version" in package.json. Every file gets a .sha256 next to it; the app's
# updater refuses downloads without one.
name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Read release version
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Require a new version for releases from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          existing=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")
          [ -z "$existing" ] || { echo "Tag $RELEASE_TAG already exists; bump package.json before releasing."; exit 1; }
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(node -p "require('./package.json').version")"
          [ "$want" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json ($want)"; exit 1; }

  app:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        shell: bash
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Unit tests
        if: runner.os != 'Windows'
        shell: bash
        run: npm test 2>&1 | tee ci-test.log
      - name: Build
        shell: bash
        run: node scripts/build.mjs --prod 2>&1 | tee ci-build.log
      - name: Package
        shell: bash
        run: npx electron-builder ${{ matrix.target }} --publish never 2>&1 | tee ci-package.log
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Checksums
        shell: bash
        run: |
          cd release
          for f in *.dmg *-mac-*.zip *.exe; do
            [ -f "$f" ] || continue
            if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
          done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*-mac-*.zip
            release/*.exe
            release/*.sha256

  source:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Source package (for project-folder and portable installs)
        run: node scripts/release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: source
          if-no-files-found: error
          path: release/scriptwright-*.zip*

  publish:
    needs: [check, app, source]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: out/*
          generate_release_notes: true
